name: Build Bcore AAR

# Beast Cloner — cloud build for the BlackBox engine (Bcore) AAR.
# No local dev machine needed: this runs on GitHub-hosted runners.
# The engine source is NOT stored in this repo. The workflow clones the
# public Apache-2.0 mirror (warren-bank/mirror-Android-BlackBox — the same
# source verified locally, root LICENSE is Apache-2.0) at build time and
# builds :Bcore:assembleRelease from it. This repo holds only this
# workflow; the built AAR is published to a GitHub Release below.
# SDK NOTES (fixes for run #1 and run #2 failures):
# - Run #1 failed because android-actions/setup-android@v3 downloads
#   cmdline-tools 16.0 whose sdkmanager requires JDK 17, but the project
#   needs JDK 11. Run #2 then failed because that same action tries to
#   install the obsolete "tools" package, which no longer exists in the
#   SDK repository ("Failed to find package 'tools'").
# - FIX: no setup-android action at all. The runner already ships an
#   Android SDK (ANDROID_SDK_ROOT) with cmdline-tools 12.0, which works
#   fine under JDK 11. This workflow installs what the build needs
#   (platform android-30, build-tools, NDK, CMake) with that preinstalled
#   sdkmanager, then builds under JDK 11 (Gradle 6.1.1 / AGP 4.0.1).
# Starting versions only — if the native build errors, adjust the NDK/CMake
# pins per the error (AGP 4.0.1-era native code may want an older NDK).

permissions:
  contents: write

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-aar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout workflow repo
        uses: actions/checkout@v4

      - name: Clone BlackBox engine source (public Apache-2.0 mirror)
        run: git clone --depth 1 https://github.com/warren-bank/mirror-Android-BlackBox.git engine

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"

      - name: Install SDK packages (preinstalled sdkmanager)
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          echo "SDK_ROOT=$SDK_ROOT"
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-30" \
            "build-tools;28.0.2" \
            "build-tools;30.0.3" \
            "ndk;25.2.9519653" \
            "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$SDK_ROOT/ndk/25.2.9519653" >> "$GITHUB_ENV"

      - name: Set up Gradle 6.1.1
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 6.1.1

      - name: Build Bcore release AAR
        working-directory: engine
        run: gradle :Bcore:assembleRelease --no-daemon --stacktrace

      - name: Upload Bcore AAR as artifact
        uses: actions/upload-artifact@v4
        with:
          name: bcore-aar
          path: engine/Bcore/build/outputs/aar/*.aar

      - name: Publish AAR to a release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="bcore-aar-${{ github.run_number }}"
          gh release create "$TAG" engine/Bcore/build/outputs/aar/*.aar \
            --title "Bcore AAR build $TAG" \
            --notes "BlackBox Bcore engine AAR built by GitHub Actions (run ${{ github.run_number }})."
