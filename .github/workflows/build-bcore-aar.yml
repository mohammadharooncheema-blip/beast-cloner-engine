name: Build Bcore AAR

# Beast Cloner — cloud build for the BlackBox engine (Bcore) AAR.
# No local dev machine needed: this runs on GitHub-hosted runners.
# The engine source is NOT stored in this repo. The workflow clones the
# public Apache-2.0 mirror (warren-bank/mirror-Android-BlackBox — the same
# source verified locally, root LICENSE is Apache-2.0) at build time and
# builds :Bcore:assembleRelease from it. This repo holds only this
# workflow; the built AAR is published to a GitHub Release below.
# SDK/JDK HISTORY (three failed runs, each fixed in turn):
# - Run #1: android-actions/setup-android@v3 downloaded cmdline-tools 16.0
#   whose sdkmanager requires JDK 17, but the workflow had only JDK 11.
# - Run #2: with JDK 17 the licenses passed, but that same action tries to
#   install the obsolete "tools" package, which no longer exists in the
#   SDK repository ("Failed to find package 'tools'").
# - Run #3: dropping the action and using the PREINSTALLED sdkmanager
#   under JDK 11 failed too — because the runner's preinstalled
#   cmdline-tools "latest" is now ALSO 16.0 (class file 61.0 = Java 17),
#   not the old 12.0 it used to be. JDK 11 cannot run it at all.
# - COMBINED FIX: no setup-android action; JDK 17 for the SDK-packages
#   install step (the current sdkmanager 16.0 requires it), then JDK 11
#   for the Gradle 6.1.1 / AGP 4.0.1 build (which requires JDK 11).
#   This got run #4 past setup for the first time — all setup steps passed.
# DEPENDENCY HISTORY:
# - Run #4 reached the real build, then failed resolving
#   me.weishu:free_reflection:3.0.1 — it is not on JCenter (dead since the
#   Bintray sunset), Maven Central, Google, or JitPack under those
#   coordinates. BlackBox uses exactly one API from it:
#   me.weishu.reflection.Reflection.unseal(Context) in BlackBoxCore.
# - FIX: a Gradle init script adds the Aliyun JCenter mirror
#   (maven.aliyun.com/repository/jcenter) to every project's repositories,
#   so the ORIGINAL 3.0.1 artifact resolves unchanged — no code or
#   version change. Run #5 proved the mirror works (no more resolution
#   error). If the mirror ever lacks it, the fallback is the JitPack
#   coordinate com.github.tiann:FreeReflection (same library, same Java
#   package) or vendoring the library source.
# NATIVE-BUILD HISTORY:
# - Run #5 got into real compilation, then failed at
#   :Bcore:pine-core:externalNativeBuildRelease with 14 errors in
#   jni_bridge.cpp / scoped-reference code. Root cause: NO ndkVersion or
#   cmake.version is declared anywhere in the project, so AGP 4.0.1 fell
#   back to its defaults — CMake 3.10.2 (too old to detect the compiler,
#   says so in its own warning) and the NEWEST installed NDK, 30.x, whose
#   new Clang trips pine-core's -Wall -Wextra -Werror flags on this
#   2020-era code. ANDROID_NDK_HOME is ignored by AGP 4.0.1 (deprecated),
#   which is why installing NDK 25 did not help.
# - FIX (run #6): pin the ERA versions — NDK 21.4.7075529 (the NDK this
#   code was written against) via local.properties ndk.dir, and CMake
#   3.22.1 via cmake.version in the two live native modules (Bcore,
#   pine-core; pine-xposed-res's native block is commented out,
#   pine-xposed has none). The pin step itself succeeded, and the build
#   did use CMake 3.22.1 — but run #6 failed EARLIER, at
#   :Bcore:generateJsonModelRelease, because AGP 4.0.1's Revision parser
#   rejects CMake 3.22.1's reported version string "3.22.1-g37088a8"
#   (the -g git-hash suffix). The build never reached compilation, so
#   NDK 21's effect on run #5's -Werror errors is STILL UNOBSERVED.
# - Run #7 FAILED the SAME way at :Bcore:generateJsonModelRelease:
#   CMake 3.18.1's SDK package ALSO reports a -g suffixed version
#   ("3.18.1-g262b901"), which AGP 4.0.1's Revision parser rejects —
#   the "clean 3.18.1" assumption was WRONG. Lesson: SDK-packaged CMake
#   binaries carry git-hash suffixes; pinning another SDK CMake version
#   does not by itself fix the parser rejection.
# - Run #8 FAILED EARLIER, at "Install SDK packages": sdkmanager
#   reported "Failed to find package 'cmake;3.10.2'" — Google no longer
#   lists CMake 3.10.2 in the SDK repository. Run #5 used the RUNNER'S
#   PREINSTALLED 3.10.2, never an sdkmanager install, which is why the
#   pin could not be installed now.
# - FIX (this version): back to CMake 3.18.1 (sdkmanager CAN install
#   it, proven in run #7), but replace its binary with the OFFICIAL
#   Kitware 3.18.1 binary, which reports a clean "3.18.1" with no -g
#   suffix — the SDK package's binary is the -g suffixed one AGP 4.0.1
#   rejects. The SDK package.xml is kept, so AGP still sees CMake
#   3.18.1 as installed; only bin/ + share/ are swapped. NDK 21 pin
#   unchanged. The new step prints `cmake --version` so the log proves
#   the clean version before the build runs.
# SIBLING MODULES (run #10): the run #9 Bcore AAR alone is NOT
#   self-contained — at runtime Bcore touches Pine (black-fake,
#   black-hook, android-mirror, pine-core incl. its native libpine.so,
#   pine-xposed, pine-xposed-res), none of which :Bcore:assembleRelease
#   packages. The integration APK built from it compiles and links but
#   cannot virtualize without them (exactly 2 dangling Pine refs in
#   dex). So this workflow now also builds every sibling module's
#   release AAR and publishes them in the same release; the app build
#   then unpacks/dexes them alongside Bcore.
# ANDROID 13+ LONG-FLAGS CRASH (run #11): on the user's Android 15
#   phone, every virtual launch died in ActivityThread.handleBindApplication
#   with "java.lang.Long cannot be cast to java.lang.Integer" at
#   IPackageManagerProxy$GetApplicationInfo.hook (line 243):
#   `int flags = (int) args[1]`. Android 13 changed the PackageManager
#   AIDL flags params from int to long, so the framework passes a Long
#   where this 2020-era engine casts to int. FIX: a patch step rewrites
#   all 24 `(int) args[...]` casts in the fake/service proxies to
#   `((Number) args[...]).intValue()`, which accepts Integer (old
#   Android) and Long (Android 13+) alike. The setHiddenApiExemptions
#   NoSuchMethodException in the same log is a caught warning, NOT the
#   crash — left alone.
# ANDROID 15 NATIVE-HOOK CRASH (run #12): with run #11 installed, the
#   virtual process got PAST the ClassCastException and died one step
#   later, in BActivityThread.handleBindApplication -> IOCore.enableRedirect
#   -> NativeCore.enableIO -> UnixFileSystemHook::init -> JniHook::HookJniFun
#   for java/io/UnixFileSystem.canonicalize0, with
#   "NoSuchMethodError: no native method ...canonicalize0..." followed by
#   SIGABRT ("No pending exception expected"). On Android 15 that method
#   can no longer be hooked as a native method, so RegisterNatives fails —
#   and HookJniFun returns WITHOUT clearing the pending exception, so the
#   very next JNI call aborts the whole process. FIX: make a failed hook
#   a graceful skip, never a poisoned process — clear the pending
#   exception after a RegisterNatives failure, and also after a failed
#   GetArtMethod (hidden-API artMethod access is itself fragile on
#   Android 15). The canonicalize0 redirect is then simply missing on
#   Android 15; the other file hooks still apply and bind survives.
#
# ANDROID 15 BIND NPE (run #13): with run #12 installed, clones died at
#   bind with "NullPointerException: Attempt to read from field
#   'metaData' on a null object reference in ActivityThread
#   .handleBindApplication". AOSP Android 15's handleBindApplication
#   ends with a font-preload block that calls getApplicationInfo and
#   reads info.metaData WITHOUT a null check — so a null return is
#   fatal. BlackBox's BPackageManagerService returned null for two
#   reasons: (1) its getApplicationInfo/getPackageInfo bail out with
#   null whenever the queried virtual user does not exist — and the
#   bind-time query runs before BlackBox's re-bind establishes the
#   clone's user, so it queries with a nonexistent user; (2) its
#   SharedUserSetting parcel writer writes 3 fields but the CREATOR
#   reads only 2 (seInfoTargetSdkVersion is dropped), so every load
#   logs "consumed 160 bytes, but 164 expected" and loses that field.
#   FIX: (a) host-package queries no longer pass through the
#   exists() gate; (b) when the queried user does not exist AND the
#   package is not installed for that user, resolve it in a user
#   where it IS installed instead of returning null — real users
#   keep strict isolation (an existing user still gets null for a
#   package not installed in that user); (c) the CREATOR reads the
#   third int, matching writeToParcel.
#
# POST-BIND WEDGE — DIAGNOSTIC ONLY (run #15): with run #14 installed,
#   clones pass bind (process alive, GC healthy, heap growing) but the
#   first activity never draws past its starting window: TikTok sticks
#   on its splash logo, other apps on a black/blank screen, input goes
#   nowhere, no crash, no ANR. Logcat cannot show WHERE the main
#   thread is blocked, so this step adds a watchdog: 20s after bind,
#   a background thread dumps every thread's stack to logcat under
#   tag BeastDiag (chunked so logd does not truncate). The dump still
#   fires even if the main thread is blocked, because it runs off the
#   main looper. No behavior change — pure diagnostics. The app-side
#   Log dikhao filter gains the beastdiag keyword for this build.
#
# LAUNCH-PATH LOGGING — DIAGNOSTIC ONLY (run #16, v0.16-diag2): the
#   18:14 BeastDiag dump proved the virtual main thread is IDLE, not
#   blocked — so the activity-launch transaction stalls before/at
#   delivery. But the launch path logs NOTHING: HCallbackProxy never
#   logs on EXECUTE_TRANSACTION, and ProxyActivity.onCreate logs only
#   under a tag the app's Log dikhao filter drops. So today's log
#   cannot answer whether the transaction arrived, whether the
#   LaunchActivityItem was found, or whether the stub ever ran. This
#   step adds BeastDiag logs at exactly those three points (all under
#   tag BeastDiag, so the existing app filter keeps them): (1) every
#   EXECUTE_TRANSACTION receipt in HCallbackProxy.handleMessage,
#   (2) launch-item/intent null cases + the launch intent itself in
#   handleLaunchActivity, (3) launching-record null in the isS branch,
#   (4) the stub target (or null) in ProxyActivity.onCreate. The
#   v0.15 thread-dump watchdog stays. No behavior change — the logs
#   only reveal which side of the launch is broken, so the fix after
#   this build is targeted, not guessed.

permissions:
  contents: write

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-aar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout workflow repo
        uses: actions/checkout@v4

      - name: Clone BlackBox engine source (public Apache-2.0 mirror)
        run: git clone --depth 1 https://github.com/warren-bank/mirror-Android-BlackBox.git engine

      - name: Patch Android 13+ long-flags crash (ClassCastException)
        run: |
          python3 - <<'PY'
          import re, glob
          files = glob.glob('engine/Bcore/src/main/java/top/niunaijun/blackbox/fake/service/**/*.java', recursive=True)
          total = 0
          for p in files:
              s = open(p).read()
              s2, n = re.subn(r'\(int\) args\[([^\]]+)\]', r'((Number) args[\1]).intValue()', s)
              if n:
                  open(p, 'w').write(s2)
                  print(p, 'patched', n, 'cast(s)')
                  total += n
          assert total >= 24, total
          print('total casts patched:', total)
          PY

      - name: Patch Android 15 native-hook crash (failed hook must not abort)
        run: |
          python3 - <<'PY'
          p = 'engine/Bcore/src/main/cpp/JniHook/JniHook.cpp'
          s = open(p).read()
          old1 = "    auto artMethod = reinterpret_cast<uintptr_t *>(GetArtMethod(env, clazz, method));\n    if (!CheckFlags(artMethod)) {"
          new1 = ("    auto artMethod = reinterpret_cast<uintptr_t *>(GetArtMethod(env, clazz, method));\n"
                  "    if (env->ExceptionCheck()) {\n"
                  "        env->ExceptionClear();\n"
                  "        ALOGE(\"get art method error. class：%s, method：%s\", class_name, method_name);\n"
                  "        return;\n"
                  "    }\n"
                  "    if (!CheckFlags(artMethod)) {")
          assert s.count(old1) == 1, ('artMethod guard', s.count(old1))
          s = s.replace(old1, new1)
          old2 = "    if (env->RegisterNatives(clazz, gMethods, 1) < 0) {\n        ALOGE(\"jni hook error. class：%s, method：%s\", class_name, method_name);\n        return;\n    }"
          new2 = ("    if (env->RegisterNatives(clazz, gMethods, 1) < 0) {\n"
                  "        env->ExceptionClear();\n"
                  "        ALOGE(\"jni hook error. class：%s, method：%s\", class_name, method_name);\n"
                  "        return;\n"
                  "    }")
          assert s.count(old2) == 1, ('registerNatives clear', s.count(old2))
          s = s.replace(old2, new2)
          open(p, 'w').write(s)
          print('JniHook.cpp patched: failed hooks now clear pending exceptions')
          PY

      - name: Patch Android 15 bind NPE (null ApplicationInfo at bind)
        run: |
          python3 - <<'PY'
          # (a) SharedUserSetting: CREATOR must read the 3rd int it writes
          p = 'engine/Bcore/src/main/java/top/niunaijun/blackbox/core/system/pm/SharedUserSetting.java'
          s = open(p).read()
          old = ("    protected SharedUserSetting(Parcel in) {\n"
                 "        this.name = in.readString();\n"
                 "        this.userId = in.readInt();\n"
                 "    }")
          new = ("    protected SharedUserSetting(Parcel in) {\n"
                 "        this.name = in.readString();\n"
                 "        this.userId = in.readInt();\n"
                 "        this.seInfoTargetSdkVersion = in.readInt();\n"
                 "    }")
          assert s.count(old) == 1, ('SUS creator', s.count(old))
          open(p, 'w').write(s.replace(old, new))
          print('SharedUserSetting CREATOR now reads seInfoTargetSdkVersion')

          # (b)+(c) BPackageManagerService: host shortcut first, and a
          # bogus-user (pre-bind) query resolves in an installed user
          # instead of returning null (null crashes handleBindApplication)
          p = 'engine/Bcore/src/main/java/top/niunaijun/blackbox/core/system/pm/BPackageManagerService.java'
          s = open(p).read()
          old_a_head = ("    public ApplicationInfo getApplicationInfo(String packageName, int flags, int userId) {\n"
                        "        if (!sUserManager.exists(userId)) return null;\n")
          assert s.count(old_a_head) == 1, ('appinfo head', s.count(old_a_head))
          s = s.replace(old_a_head, "    public ApplicationInfo getApplicationInfo(String packageName, int flags, int userId) {\n")
          old_a_ret = "                return PackageManagerCompat.generateApplicationInfo(p, flags, ps.readUserState(userId), userId);"
          new_a_ret = ("                BPackageUserState state = ps.readUserState(userId);\n"
                       "                int resolvedUserId = userId;\n"
                       "                if (!sUserManager.exists(userId) && !state.installed) {\n"
                       "                    for (Map.Entry<Integer, BPackageUserState> e : ps.userState.entrySet()) {\n"
                       "                        if (e.getValue() != null && e.getValue().installed) {\n"
                       "                            state = e.getValue();\n"
                       "                            resolvedUserId = e.getKey();\n"
                       "                            break;\n"
                       "                        }\n"
                       "                    }\n"
                       "                }\n"
                       "                return PackageManagerCompat.generateApplicationInfo(p, flags, state, resolvedUserId);")
          assert s.count(old_a_ret) == 1, ('appinfo ret', s.count(old_a_ret))
          s = s.replace(old_a_ret, new_a_ret)
          old_p_head = ("    public PackageInfo getPackageInfo(String packageName, int flags, int userId) {\n"
                        "        if (!sUserManager.exists(userId)) return null;\n")
          assert s.count(old_p_head) == 1, ('pkginfo head', s.count(old_p_head))
          s = s.replace(old_p_head, "    public PackageInfo getPackageInfo(String packageName, int flags, int userId) {\n")
          old_p_ret = "            return PackageManagerCompat.generatePackageInfo(ps, flags, ps.readUserState(userId), userId);"
          new_p_ret = ("            BPackageUserState state = ps.readUserState(userId);\n"
                       "            int resolvedUserId = userId;\n"
                       "            if (!sUserManager.exists(userId) && !state.installed) {\n"
                       "                for (Map.Entry<Integer, BPackageUserState> e : ps.userState.entrySet()) {\n"
                       "                    if (e.getValue() != null && e.getValue().installed) {\n"
                       "                        state = e.getValue();\n"
                       "                        resolvedUserId = e.getKey();\n"
                       "                        break;\n"
                       "                    }\n"
                       "                }\n"
                       "            }\n"
                       "            return PackageManagerCompat.generatePackageInfo(ps, flags, state, resolvedUserId);")
          assert s.count(old_p_ret) == 1, ('pkginfo ret', s.count(old_p_ret))
          s = s.replace(old_p_ret, new_p_ret)
          open(p, 'w').write(s)
          print('BPackageManagerService patched: getApplicationInfo + getPackageInfo bind-safe')
          PY

      - name: Patch diagnostic thread-dump watchdog (BeastDiag)
        run: |
          python3 - <<'PY'
          p = 'engine/Bcore/src/main/java/top/niunaijun/blackbox/app/BActivityThread.java'
          s = open(p).read()
          anchor = ("        try {\n"
                    "            CrashHandler.create();\n"
                    "        } catch (Throwable ignored) {\n"
                    "        }\n")
          assert s.count(anchor) == 1, ('watchdog anchor', s.count(anchor))
          code = r'''          try {
              CrashHandler.create();
          } catch (Throwable ignored) {
          }

          // DIAGNOSTIC (v0.15-diag): 20s after bind, dump every thread's
          // stack to logcat under tag BeastDiag, chunked so logd does not
          // truncate. Runs on a background thread so it still fires even
          // if the main thread is blocked during launch.
          try {
              Thread beastDiagWatchdog = new Thread(new Runnable() {
                  @Override
                  public void run() {
                      try {
                          Thread.sleep(20000);
                      } catch (InterruptedException ignored) {
                          return;
                      }
                      try {
                          StringBuilder sb = new StringBuilder();
                          sb.append("BEASTDIAG thread dump for ").append(packageName).append(" / ").append(processName);
                          for (Map.Entry<Thread, StackTraceElement[]> e : Thread.getAllStackTraces().entrySet()) {
                              Thread t = e.getKey();
                              sb.append("\nTHREAD ").append(t.getName()).append(" state=").append(t.getState());
                              for (StackTraceElement st : e.getValue()) {
                                  sb.append("\n  at ").append(st.toString());
                              }
                          }
                          String dump = sb.toString();
                          int start = 0;
                          int part = 0;
                          while (start < dump.length()) {
                              int end = Math.min(start + 3000, dump.length());
                              if (end < dump.length()) {
                                  int nl = dump.lastIndexOf('\n', end);
                                  if (nl > start) {
                                      end = nl;
                                  }
                              }
                              android.util.Log.e("BeastDiag", "part " + part + ":\n" + dump.substring(start, end));
                              part++;
                              start = end;
                          }
                      } catch (Throwable ignored) {
                      }
                  }
              });
              beastDiagWatchdog.setName("BeastDiagWatchdog");
              beastDiagWatchdog.start();
          } catch (Throwable ignored) {
          }'''
          open(p, 'w').write(s.replace(anchor, code, 1))
          print('BeastDiag watchdog patched into BActivityThread.handleBindApplication')
          PY

      - name: Patch launch-path BeastDiag logging (v0.16-diag2)
        run: |
          python3 - <<'PY'
          # HCallbackProxy: log transaction receipt, item/intent nulls,
          # the launch intent, and the isS launching-record null check.
          p = 'engine/Bcore/src/main/java/top/niunaijun/blackbox/fake/service/HCallbackProxy.java'
          s = open(p).read()
          old = ("                    if (msg.what == BRActivityThreadH.get().EXECUTE_TRANSACTION()) {\n"
                 "                        if (handleLaunchActivity(msg.obj)) {")
          new = ("                    if (msg.what == BRActivityThreadH.get().EXECUTE_TRANSACTION()) {\n"
                 "                        android.util.Log.e(\"BeastDiag\", \"HCallback EXECUTE_TRANSACTION received\");\n"
                 "                        if (handleLaunchActivity(msg.obj)) {")
          assert s.count(old) == 1, ('exec txn branch', s.count(old))
          s = s.replace(old, new)
          old = ("        if (r == null)\n"
                 "            return false;")
          new = ("        if (r == null) {\n"
                 "            android.util.Log.e(\"BeastDiag\", \"HCallback launch item NOT FOUND\");\n"
                 "            return false;\n"
                 "        }")
          assert s.count(old) == 1, ('item null', s.count(old))
          s = s.replace(old, new)
          old = ("        if (intent == null)\n"
                 "            return false;")
          new = ("        if (intent == null) {\n"
                 "            android.util.Log.e(\"BeastDiag\", \"HCallback launch intent null\");\n"
                 "            return false;\n"
                 "        }\n"
                 "        android.util.Log.e(\"BeastDiag\", \"HCallback launch intent=\" + intent);")
          assert s.count(old) == 1, ('intent null', s.count(old))
          s = s.replace(old, new)
          old = ("                Object record = BRActivityThread.get(BlackBoxCore.mainThread()).getLaunchingActivity(token);")
          new = ("                Object record = BRActivityThread.get(BlackBoxCore.mainThread()).getLaunchingActivity(token);\n"
                 "                android.util.Log.e(\"BeastDiag\", \"HCallback launchingRecord null=\" + (record == null));")
          assert s.count(old) == 1, ('launching record', s.count(old))
          s = s.replace(old, new)
          open(p, 'w').write(s)
          print('HCallbackProxy launch-path logging patched')
          # ProxyActivity: log the stub target (or null) under BeastDiag.
          p = 'engine/Bcore/src/main/java/top/niunaijun/blackbox/proxy/ProxyActivity.java'
          s = open(p).read()
          old = "        ProxyActivityRecord record = ProxyActivityRecord.create(getIntent());"
          new = ("        ProxyActivityRecord record = ProxyActivityRecord.create(getIntent());\n"
                 "        if (record.mTarget != null) {\n"
                 "            Log.e(\"BeastDiag\", \"ProxyActivity target=\" + record.mTarget);\n"
                 "        } else {\n"
                 "            Log.e(\"BeastDiag\", \"ProxyActivity target=null\");\n"
                 "        }")
          assert s.count(old) == 1, ('proxy record', s.count(old))
          open(p, 'w').write(s.replace(old, new))
          print('ProxyActivity launch-path logging patched')
          PY

      - name: Set up JDK 17 (for SDK packages install)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install SDK packages (preinstalled sdkmanager)
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          echo "SDK_ROOT=$SDK_ROOT"
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-30" \
            "build-tools;28.0.2" \
            "build-tools;30.0.3" \
            "ndk;21.4.7075529" \
            "cmake;3.18.1"

      - name: Set up JDK 11 (for Gradle 6.1.1 / AGP 4.0.1 build)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"

      - name: Set up Gradle 6.1.1
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 6.1.1

      - name: Add JCenter mirror (free_reflection lives only on dead JCenter)
        run: |
          cat > /tmp/jcenter-mirror.init.gradle <<'EOF'
          allprojects {
              repositories {
                  maven { url 'https://maven.aliyun.com/repository/jcenter' }
              }
          }
          EOF
          cat /tmp/jcenter-mirror.init.gradle

      - name: Pin era NDK + CMake for the 2020-era native code
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          printf 'sdk.dir=%s\nndk.dir=%s/ndk/21.4.7075529\n' "$SDK_ROOT" "$SDK_ROOT" > engine/local.properties
          cat engine/local.properties
          python3 - <<'PY'
          import re
          for p in ('engine/Bcore/build.gradle', 'engine/Bcore/pine-core/build.gradle'):
              s = open(p).read()
              s2, n = re.subn(r'(\n([ \t]*)path\s+[^\n]*CMakeLists\.txt[^\n]*\n)', r'\1\2version "3.18.1"\n', s)
              assert n == 1, (p, n)
              open(p, 'w').write(s2)
              print(p, 'cmake version pinned')
          PY

      - name: Use official CMake binary (clean version string)
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          cd /tmp
          curl -fsSL -o cmake.tar.gz https://cmake.org/files/v3.18/cmake-3.18.1-Linux-x86_64.tar.gz || curl -fsSL -o cmake.tar.gz https://github.com/Kitware/CMake/releases/download/v3.18.1/cmake-3.18.1-Linux-x86_64.tar.gz
          mkdir -p /tmp/cmake-official
          tar -xzf cmake.tar.gz -C /tmp/cmake-official --strip-components=1
          rm -rf "$SDK_ROOT/cmake/3.18.1/bin" "$SDK_ROOT/cmake/3.18.1/share"
          cp -r /tmp/cmake-official/bin /tmp/cmake-official/share "$SDK_ROOT/cmake/3.18.1/"
          "$SDK_ROOT/cmake/3.18.1/bin/cmake" --version

      - name: Build Bcore release AAR
        working-directory: engine
        run: gradle :Bcore:assembleRelease --no-daemon --stacktrace -I /tmp/jcenter-mirror.init.gradle

      - name: Build sibling engine AARs
        working-directory: engine
        run: gradle :Bcore:black-fake:assembleRelease :Bcore:black-hook:assembleRelease :Bcore:pine-core:assembleRelease :Bcore:pine-xposed:assembleRelease :Bcore:pine-xposed-res:assembleRelease :android-mirror:assembleRelease --no-daemon --stacktrace -I /tmp/jcenter-mirror.init.gradle

      - name: Upload Bcore AAR as artifact
        uses: actions/upload-artifact@v4
        with:
          name: bcore-aar
          path: |
            engine/Bcore/build/outputs/aar/*.aar
            engine/Bcore/black-fake/build/outputs/aar/*.aar
            engine/Bcore/black-hook/build/outputs/aar/*.aar
            engine/Bcore/pine-core/build/outputs/aar/*.aar
            engine/Bcore/pine-xposed/build/outputs/aar/*.aar
            engine/Bcore/pine-xposed-res/build/outputs/aar/*.aar
            engine/android-mirror/build/outputs/aar/*.aar

      - name: Publish AAR to a release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="bcore-aar-${{ github.run_number }}"
          gh release create "$TAG" \
            engine/Bcore/build/outputs/aar/*.aar \
            engine/Bcore/black-fake/build/outputs/aar/*.aar \
            engine/Bcore/black-hook/build/outputs/aar/*.aar \
            engine/Bcore/pine-core/build/outputs/aar/*.aar \
            engine/Bcore/pine-xposed/build/outputs/aar/*.aar \
            engine/Bcore/pine-xposed-res/build/outputs/aar/*.aar \
            engine/android-mirror/build/outputs/aar/*.aar \
            --title "Bcore AAR build $TAG" \
            --notes "BlackBox Bcore engine AAR built by GitHub Actions (run ${{ github.run_number }})."
